<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account — CBHS Bank</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo-link">
        <img src="/images/casco-bay-logo.png" alt="Casco Bay High School logo">
        <div class="logo-text">
          Casco Bay High School
          <span>Bank</span>
        </div>
      </a>
      <nav class="main-nav" aria-label="Main">
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/accounts" class="active">Accounts</a></li>
          <li><a href="/new-account">Open account</a></li>
          <li><a href="/transfer">Transfer</a></li>
          <li><a href="/admin">Admin</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="page-header">
        <h1 id="title">Account</h1>
        <p class="lead" id="subtitle"></p>
      </div>

      <p id="status" class="alert" hidden></p>

      <div id="detail" hidden>
        <p class="balance-line">Balance: <strong id="balance"></strong></p>

        <div class="form-grid">
          <form id="deposit-form" class="card">
            <h2>Deposit</h2>
            <label for="deposit-amount">Amount</label>
            <input id="deposit-amount" type="number" min="0.01" step="0.01" required>
            <label for="deposit-note">Note (optional)</label>
            <input id="deposit-note" type="text">
            <button type="submit" class="btn">Deposit</button>
          </form>

          <form id="withdraw-form" class="card">
            <h2>Withdraw</h2>
            <label for="withdraw-amount">Amount</label>
            <input id="withdraw-amount" type="number" min="0.01" step="0.01" required>
            <label for="withdraw-note">Note (optional)</label>
            <input id="withdraw-note" type="text">
            <button type="submit" class="btn">Withdraw</button>
          </form>
        </div>

        <h2>Transactions</h2>
        <p id="no-txns" class="note" hidden>No transactions yet.</p>
        <table class="data-table" id="txn-table" hidden>
          <thead>
            <tr>
              <th>Date</th>
              <th>Type</th>
              <th>Amount</th>
              <th>Note</th>
            </tr>
          </thead>
          <tbody id="txn-rows"></tbody>
        </table>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <p><strong>Casco Bay High School</strong></p>
        <p><a href="https://cbhsstem.org">cbhsstem.org</a></p>
      </div>
    </div>
  </footer>

  <script src="/js/format.js"></script>
  <script src="/js/api.js"></script>
  <script>
    var params = new URLSearchParams(window.location.search);
    var number = params.get("number");
    var status = document.getElementById("status");

    async function loadAccount() {
      if (!number) {
        showMessage(status, "Account not found", true);
        return;
      }
      try {
        var account = await apiGet("/api/accounts/" + number);
        document.getElementById("title").textContent = account.ownerName;
        document.getElementById("subtitle").textContent =
          "Account " + account.accountNumber + " · " + typeLabel(account.accountType);
        document.getElementById("balance").textContent = money(account.balance);
        document.getElementById("detail").hidden = false;
        renderTxns(account.transactions || []);
      } catch (err) {
        document.getElementById("detail").hidden = true;
        showMessage(status, err.message, true);
      }
    }

    function renderTxns(list) {
      var table = document.getElementById("txn-table");
      var empty = document.getElementById("no-txns");
      var rows = document.getElementById("txn-rows");
      rows.innerHTML = "";
      if (list.length === 0) {
        table.hidden = true;
        empty.hidden = false;
        return;
      }
      empty.hidden = true;
      table.hidden = false;
      list.forEach(function (t) {
        var tr = document.createElement("tr");
        tr.innerHTML =
          "<td>" + (t.stamp || "") + "</td>" +
          "<td>" + txnLabel(t.type) + "</td>" +
          "<td class=\"money\">" + money(t.amount) + "</td>" +
          "<td>" + (t.note || "") + "</td>";
        rows.appendChild(tr);
      });
    }

    async function moneyAction(path, amount, note, attempted) {
      showMessage(status, attempted, false);
      var result = await apiPost(path, { amount: Number(amount), note: note });
      if (result.ok === false) {
        showMessage(status, attempted + " " + result.error + ".", true);
        return;
      }
      showMessage(status, attempted + " New balance: " + money(result.balance) + ".", false);
      await loadAccount();
    }

    document.getElementById("deposit-form").addEventListener("submit", async function (event) {
      event.preventDefault();
      try {
        await moneyAction(
          "/api/accounts/" + number + "/deposit",
          document.getElementById("deposit-amount").value,
          document.getElementById("deposit-note").value,
          "Deposit attempted."
        );
        document.getElementById("deposit-form").reset();
      } catch (err) {
        showMessage(status, "Deposit attempted. " + err.message, true);
      }
    });

    document.getElementById("withdraw-form").addEventListener("submit", async function (event) {
      event.preventDefault();
      try {
        await moneyAction(
          "/api/accounts/" + number + "/withdraw",
          document.getElementById("withdraw-amount").value,
          document.getElementById("withdraw-note").value,
          "Withdrawal attempted."
        );
        document.getElementById("withdraw-form").reset();
      } catch (err) {
        showMessage(status, "Withdrawal attempted. " + err.message, true);
      }
    });

    loadAccount();
  </script>
</body>
</html>
