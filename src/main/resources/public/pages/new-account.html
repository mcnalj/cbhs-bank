<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open account — CBHS Bank</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo-link">
        <img src="/images/casco-bay-logo.png" alt="Casco Bay High School logo">
        <div class="logo-text">
          Casco Bay High School
          <span>Bank</span>
        </div>
      </a>
      <nav class="main-nav" aria-label="Main">
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/accounts">Accounts</a></li>
          <li><a href="/new-account" class="active">Open account</a></li>
          <li><a href="/transfer">Transfer</a></li>
          <li><a href="/admin">Admin</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="page-header">
        <h1>Open account</h1>
        <p class="lead">The bank assigns the next account number. You do not pick one.</p>
      </div>

      <p id="status" class="alert" hidden></p>

      <form id="form" class="card form-narrow">
        <label for="ownerName">Owner name</label>
        <input id="ownerName" name="ownerName" type="text" required>

        <label for="accountType">Type</label>
        <select id="accountType" name="accountType">
          <option value="checking">Checking</option>
          <option value="savings">Savings</option>
        </select>

        <label for="startingBalance">Starting balance</label>
        <input id="startingBalance" name="startingBalance" type="number" min="0" step="0.01" value="0">

        <button type="submit" class="btn">Open account</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <p><strong>Casco Bay High School</strong></p>
        <p><a href="https://cbhsstem.org">cbhsstem.org</a></p>
      </div>
    </div>
  </footer>

  <script src="/js/format.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById("form").addEventListener("submit", async function (event) {
      event.preventDefault();
      var status = document.getElementById("status");
      try {
        var result = await apiPost("/api/accounts", {
          ownerName: document.getElementById("ownerName").value,
          accountType: document.getElementById("accountType").value,
          startingBalance: Number(document.getElementById("startingBalance").value)
        });
        if (result.ok === false) {
          showMessage(status, result.error, true);
          return;
        }
        window.location.href = "/account?number=" + result.accountNumber;
      } catch (err) {
        showMessage(status, err.message, true);
      }
    });
  </script>
</body>
</html>
